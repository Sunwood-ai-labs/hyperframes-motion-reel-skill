name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            README.md
            README.ja.md
            docs/**/*.md
            !docs/node_modules/**

  skill-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SKILL.md frontmatter
        run: |
          head -n 1 SKILL.md | grep -qx -- '---'
          awk 'NR>1 && /^---$/ {exit} NR>1 {print}' SKILL.md > /tmp/fm.txt
          grep -q '^name: hyperframes-motion-reel$' /tmp/fm.txt
          grep -q '^description: .\+' /tmp/fm.txt
          echo "SKILL.md frontmatter OK"

  docs-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build
